<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thrust or Bust — Kelleher Innovations</title>
<link rel="stylesheet" href="style.css">
<style>
  .tb-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tb-topbar { width: 100%; max-width: 400px; }
  .tb-exit-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 0.82rem; font-weight: 700; text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }
  .tb-exit-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tb-hud { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .tb-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    font-size: 0.85rem; font-weight: 700;
  }
  .tb-chip.balance { color: #ffd166; }
  #tbCanvas {
    background: radial-gradient(ellipse at 50% 0%, #1c2340 0%, #0a0e1e 70%);
    border: 2px solid var(--border); border-radius: 10px; touch-action: manipulation; cursor: pointer;
    max-width: 100%;
  }
  .tb-hint { color: var(--muted); font-size: 0.85rem; text-align: center; max-width: 400px; }
  .tb-error { color: #ff6b6b; font-size: 0.82rem; min-height: 1.2em; }
  .tb-btn {
    padding: 9px 18px; background: var(--accent); color: #000; border: none;
    border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
    font-family: inherit; transition: background 0.2s, transform 0.15s;
  }
  .tb-btn:hover { background: #00e0e0; transform: translateY(-1px); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="site-brand">
      <strong>Kelleher Innovations</strong>
      <span>Building Intelligent Systems</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="games.html">Games</a>
    </nav>
  </div>
</header>

<main>
  <div class="tb-wrap">
    <div class="tb-topbar">
      <a href="games.html" class="tb-exit-btn">&larr; Exit to Games</a>
    </div>
    <h2>🚀 Thrust or Bust</h2>
    <div class="tb-hud">
      <span class="tb-chip">Gates: <span id="scoreEl">0</span></span>
      <span class="tb-chip">Best: <span id="bestEl">0</span></span>
      <span class="tb-chip balance" id="coinChip" style="display:none;">🪙 <span id="coinBalance">0</span></span>
    </div>
    <canvas id="tbCanvas" width="360" height="520"></canvas>
    <p class="tb-hint">Tap/hold left or right side of the ship (or ← / →) to thrust and weave through the gates. 20 KellsCoins per gate cleared if you're logged in — <span id="loginHint"><a href="games.html">log in</a> to earn coins.</span></p>
    <div class="tb-error" id="tbError"></div>
    <button class="tb-btn" id="restartBtn" style="display:none;">Play Again</button>
  </div>
</main>

<script>
  const GAMES_API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://localhost:4567/games" : "https://api.kellinnovations.com/games";

  let currentUser = null;
  (async () => {
    try {
      currentUser = await (await fetch(GAMES_API + "/auth/me", { credentials: "include" })).json();
      if (currentUser && currentUser.id) {
        document.getElementById("coinChip").style.display = "inline-flex";
        document.getElementById("coinBalance").textContent = currentUser.kellscoins.toLocaleString();
        document.getElementById("loginHint").textContent = "";
      } else {
        currentUser = null;
      }
    } catch (e) { currentUser = null; }
  })();

  async function claimCoins(score) {
    if (!currentUser || score <= 0) return;
    try {
      const res = await fetch(GAMES_API + "/claim_scored", {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ game: "thrustorbust", score }),
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById("coinBalance").textContent =
          (data.balance !== undefined ? data.balance : currentUser.kellscoins).toLocaleString();
        if (data.awarded) document.getElementById("tbError").textContent = "";
      } else if (res.status !== 429) {
        document.getElementById("tbError").textContent = data.error || "";
      }
    } catch (e) { /* offline — silently skip */ }
  }

  // ── Game ────────────────────────────────────────────────────────────
  // Transposed Flappy Bird physics: there the bird is fixed in X and pipes
  // scroll horizontally with a vertical gap; here the rocket is fixed in Y
  // and gates scroll vertically (downward, toward the rocket) with a
  // horizontal gap. Same fixed-60Hz-step + render-interpolation pattern as
  // flappybird.html/flappygolf.html so motion feels identical across
  // refresh rates.
  const canvas = document.getElementById("tbCanvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const STEP_MS = 1000 / 60;
  const MAX_FRAME_MS = 250;

  const ROCKET_Y = H - 90;
  const ROCKET_R = 13;
  const THRUST_ACCEL = 0.42;
  const DRAG = 0.055;
  const MAX_VX = 6.2;
  const GATE_HEIGHT = 16;
  const GATE_SPEED_START = 1.7;
  const GATE_SPEED_MAX = 3.0;
  const GATE_INTERVAL = 115; // fixed steps between new gates
  const GAP_START = 130;
  const GAP_MIN = 78;

  let rocket, gates, frame, score, best, running, gameOver;
  let gateSpeed;
  let leftHeld = false, rightHeld = false;
  let acc = 0, lastTs = 0;

  function loadBest() { return parseInt(localStorage.getItem("thrustorbust_best") || "0", 10); }
  function saveBest(v) { localStorage.setItem("thrustorbust_best", String(v)); }

  function reset() {
    rocket = { x: W / 2, prevX: W / 2, vx: 0 };
    gates = [];
    frame = 0;
    acc = 0;
    lastTs = 0;
    score = 0;
    gateSpeed = GATE_SPEED_START;
    running = true;
    gameOver = false;
    best = loadBest();
    document.getElementById("scoreEl").textContent = "0";
    document.getElementById("bestEl").textContent = best;
    document.getElementById("restartBtn").style.display = "none";
    document.getElementById("tbError").textContent = "";
  }

  function spawnGate() {
    const gap = Math.max(GAP_MIN, GAP_START - score * 2.2);
    const margin = gap / 2 + 20;
    const gapCenterX = margin + Math.random() * (W - margin * 2);
    gates.push({ y: -GATE_HEIGHT, prevY: -GATE_HEIGHT, gapCenterX, gap, passed: false });
  }

  function step() {
    if (!running || gameOver) return;
    frame++;
    rocket.prevX = rocket.x;

    const thrustDir = (rightHeld ? 1 : 0) - (leftHeld ? 1 : 0);
    rocket.vx += thrustDir * THRUST_ACCEL;
    rocket.vx *= (1 - DRAG);
    rocket.vx = Math.max(-MAX_VX, Math.min(MAX_VX, rocket.vx));
    rocket.x += rocket.vx;
    if (rocket.x - ROCKET_R < 0) { rocket.x = ROCKET_R; rocket.vx = 0; }
    if (rocket.x + ROCKET_R > W) { rocket.x = W - ROCKET_R; rocket.vx = 0; }

    if (frame % GATE_INTERVAL === 0) spawnGate();

    gateSpeed = Math.min(GATE_SPEED_MAX, GATE_SPEED_START + score * 0.03);
    gates.forEach(g => { g.prevY = g.y; g.y += gateSpeed; });
    gates = gates.filter(g => g.y < H + GATE_HEIGHT);

    gates.forEach(g => {
      if (!g.passed && g.y > ROCKET_Y + ROCKET_R) {
        g.passed = true;
        score++;
        document.getElementById("scoreEl").textContent = score;
      }
    });

    for (const g of gates) {
      const withinY = ROCKET_Y + ROCKET_R > g.y && ROCKET_Y - ROCKET_R < g.y + GATE_HEIGHT;
      if (withinY) {
        const leftEnd = g.gapCenterX - g.gap / 2;
        const rightStart = g.gapCenterX + g.gap / 2;
        if (rocket.x - ROCKET_R < leftEnd || rocket.x + ROCKET_R > rightStart) {
          endGame();
          return;
        }
      }
    }
  }

  function endGame() {
    gameOver = true;
    running = false;
    if (score > best) { best = score; saveBest(best); document.getElementById("bestEl").textContent = best; }
    document.getElementById("restartBtn").style.display = "inline-block";
    claimCoins(score);
  }

  function draw(alpha) {
    if (!running || gameOver) alpha = 1;
    const rx = rocket.prevX + (rocket.x - rocket.prevX) * alpha;

    ctx.clearRect(0, 0, W, H);

    // Starfield (static seeded pattern via a cheap hash, no state needed)
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    for (let i = 0; i < 40; i++) {
      const sx = (i * 53 + (frame * 0.15)) % W;
      const sy = (i * 97) % H;
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }

    // Gates
    gates.forEach(g => {
      const gy = (g.prevY ?? g.y) + (g.y - (g.prevY ?? g.y)) * alpha;
      const leftEnd = g.gapCenterX - g.gap / 2;
      const rightStart = g.gapCenterX + g.gap / 2;
      ctx.fillStyle = "#7d5fff";
      ctx.fillRect(0, gy, leftEnd, GATE_HEIGHT);
      ctx.fillRect(rightStart, gy, W - rightStart, GATE_HEIGHT);
      ctx.fillStyle = "#b9a3ff";
      ctx.fillRect(0, gy, leftEnd, 4);
      ctx.fillRect(rightStart, gy, W - rightStart, 4);
    });

    // Rocket
    ctx.save();
    ctx.translate(rx, ROCKET_Y);
    ctx.rotate(Math.max(-0.5, Math.min(0.5, rocket.vx / 10)));
    // flame
    ctx.fillStyle = "#ff8c42";
    ctx.beginPath();
    ctx.moveTo(-5, ROCKET_R * 0.6);
    ctx.lineTo(5, ROCKET_R * 0.6);
    ctx.lineTo(0, ROCKET_R * 0.6 + 10 + Math.random() * 6);
    ctx.fill();
    // body
    ctx.fillStyle = "#e8ecff";
    ctx.beginPath();
    ctx.moveTo(0, -ROCKET_R * 1.3);
    ctx.lineTo(ROCKET_R * 0.75, ROCKET_R * 0.6);
    ctx.lineTo(-ROCKET_R * 0.75, ROCKET_R * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#4ec0ca";
    ctx.beginPath();
    ctx.arc(0, -ROCKET_R * 0.2, ROCKET_R * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (!running && !gameOver) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Hold left/right to thrust and start", W / 2, H / 2);
    }
    if (gameOver) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 26px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Crashed!", W / 2, H / 2 - 16);
      ctx.font = "16px sans-serif";
      ctx.fillText(`Gates cleared: ${score}`, W / 2, H / 2 + 14);
    }
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    let elapsed = ts - lastTs;
    lastTs = ts;
    if (elapsed > MAX_FRAME_MS) elapsed = STEP_MS;
    acc += elapsed;
    let guard = 0;
    while (acc >= STEP_MS && guard++ < 8) {
      step();
      acc -= STEP_MS;
    }
    draw(acc / STEP_MS);
    requestAnimationFrame(loop);
  }

  function setHeld(clientX) {
    const rect = canvas.getBoundingClientRect();
    const localX = (clientX - rect.left) * (W / rect.width);
    if (localX < W / 2) { leftHeld = true; rightHeld = false; }
    else { rightHeld = true; leftHeld = false; }
  }

  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (gameOver) { reset(); return; }
    if (!running) running = true;
    setHeld(e.clientX);
  });
  canvas.addEventListener("pointermove", (e) => {
    if ((e.buttons & 1) && running && !gameOver) setHeld(e.clientX);
  });
  window.addEventListener("pointerup", () => { leftHeld = false; rightHeld = false; });
  window.addEventListener("pointercancel", () => { leftHeld = false; rightHeld = false; });

  document.addEventListener("keydown", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") { leftHeld = true; if (gameOver) reset(); else if (!running) running = true; }
    if (e.code === "ArrowRight" || e.code === "KeyD") { rightHeld = true; if (gameOver) reset(); else if (!running) running = true; }
  });
  document.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") leftHeld = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") rightHeld = false;
  });
  document.getElementById("restartBtn").addEventListener("click", reset);

  reset();
  running = false;
  requestAnimationFrame(loop);
</script>

</body>
</html>
