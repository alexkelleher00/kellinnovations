<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris — Kelleher Innovations</title>
<link rel="stylesheet" href="style.css">
<style>
  .tt-wrap { display: flex; gap: 24px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  .tt-side { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .tt-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    font-size: 0.85rem; font-weight: 700; width: 100%; justify-content: center; box-sizing: border-box;
  }
  .tt-chip.balance { color: #ffd166; }
  #tetCanvas { background: #0d0d18; border: 2px solid var(--border); border-radius: 8px; }
  #nextCanvas { background: #0d0d18; border: 1px solid var(--border); border-radius: 8px; }
  .tt-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; width: 140px; text-align: center;
  }
  .tt-panel h4 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 8px; }
  .tt-hint { color: var(--muted); font-size: 0.78rem; text-align: center; max-width: 320px; }
  .tt-error { color: #ff6b6b; font-size: 0.82rem; min-height: 1.2em; text-align: center; }
  .tt-btn {
    padding: 9px 18px; background: var(--accent); color: #000; border: none;
    border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
    font-family: inherit; transition: background 0.2s, transform 0.15s;
  }
  .tt-btn:hover { background: #00e0e0; transform: translateY(-1px); }
  .tt-mobile-controls { display: none; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  .tt-mobile-controls button {
    padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; font-size: 1rem; font-family: inherit;
  }
  @media (max-width: 700px) { .tt-mobile-controls { display: flex; } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="site-brand">
      <strong>Kelleher Innovations</strong>
      <span>Building Intelligent Systems</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </div>
</header>

<main>
  <h2 style="text-align:center; margin-bottom:6px;">🧱 Tetris</h2>
  <p class="tt-hint" style="margin: 0 auto 16px;">Arrow keys to move/rotate, Space to hard-drop. 200 KellsCoins for playing a game (once you top out), if you're logged in.</p>

  <div class="tt-wrap">
    <div class="tt-side">
      <div class="tt-panel">
        <h4>Score</h4>
        <div id="scoreEl" style="font-size:1.3rem; font-weight:800;">0</div>
      </div>
      <div class="tt-panel">
        <h4>Level</h4>
        <div id="levelEl" style="font-size:1.3rem; font-weight:800;">1</div>
      </div>
      <div class="tt-panel">
        <h4>Lines</h4>
        <div id="linesEl" style="font-size:1.3rem; font-weight:800;">0</div>
      </div>
    </div>

    <div>
      <canvas id="tetCanvas" width="240" height="480"></canvas>
      <div class="tt-mobile-controls">
        <button id="btnLeft">◀</button>
        <button id="btnRotate">⟳</button>
        <button id="btnRight">▶</button>
        <button id="btnDown">▼</button>
        <button id="btnDrop">⤓</button>
      </div>
    </div>

    <div class="tt-side">
      <div class="tt-panel">
        <h4>Next</h4>
        <canvas id="nextCanvas" width="100" height="100"></canvas>
      </div>
      <span class="tt-chip balance" id="coinChip" style="display:none;">🪙 <span id="coinBalance">0</span></span>
      <button class="tt-btn" id="restartBtn" style="display:none;">Play Again</button>
    </div>
  </div>

  <div class="tt-error" id="ttError"></div>
</main>

<script>
  const GAMES_API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://localhost:4567/games" : "https://api.kellinnovations.com/games";

  let currentUser = null;
  (async () => {
    try {
      currentUser = await (await fetch(GAMES_API + "/auth/me", { credentials: "include" })).json();
      if (currentUser && currentUser.id) {
        document.getElementById("coinChip").style.display = "inline-flex";
        document.getElementById("coinBalance").textContent = currentUser.kellscoins.toLocaleString();
      } else {
        currentUser = null;
      }
    } catch (e) { currentUser = null; }
  })();

  let claimed = false;
  async function claimTetrisCoins() {
    if (!currentUser || claimed) return;
    claimed = true;
    try {
      const res = await fetch(GAMES_API + "/claim", {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ game: "tetris" }),
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById("coinBalance").textContent = data.balance.toLocaleString();
      } else if (res.status !== 429) {
        document.getElementById("ttError").textContent = data.error || "";
      }
    } catch (e) { /* offline — silently skip */ }
  }

  // ── Tetris engine ───────────────────────────────────────────────────
  const COLS = 10, ROWS = 20, CELL = 24;
  const canvas = document.getElementById("tetCanvas");
  const ctx = canvas.getContext("2d");
  const nextCanvas = document.getElementById("nextCanvas");
  const nctx = nextCanvas.getContext("2d");

  const SHAPES = {
    I: [[[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]], [[0,2],[1,2],[2,2],[3,2]], [[1,0],[1,1],[1,2],[1,3]]],
    O: [[[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]]],
    T: [[[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]]],
    S: [[[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]], [[1,1],[2,1],[0,2],[1,2]], [[0,0],[0,1],[1,1],[1,2]]],
    Z: [[[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[1,2],[2,2]], [[1,0],[0,1],[1,1],[0,2]]],
    J: [[[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]], [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]]],
    L: [[[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]], [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]]],
  };
  const COLORS = { I: "#4dd9e8", O: "#ffd166", T: "#c586ff", S: "#5fd35f", Z: "#ff6b6b", J: "#4d8dff", L: "#ff9f43" };
  const TYPES = Object.keys(SHAPES);

  let grid, cur, next, score, level, lines, dropTimer, gameOver, paused;

  function randType() { return TYPES[Math.floor(Math.random() * TYPES.length)]; }

  function newPiece(type) { return { type, rotation: 0, x: 3, y: 0 }; }

  function cells(piece) {
    return SHAPES[piece.type][piece.rotation].map(([dx, dy]) => [piece.x + dx, piece.y + dy]);
  }

  function canPlace(piece) {
    for (const [x, y] of cells(piece)) {
      if (x < 0 || x >= COLS || y >= ROWS) return false;
      if (y >= 0 && grid[y][x]) return false;
    }
    return true;
  }

  function reset() {
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    cur = newPiece(randType());
    next = randType();
    score = 0; level = 1; lines = 0; gameOver = false; paused = false; claimed = false;
    document.getElementById("scoreEl").textContent = "0";
    document.getElementById("levelEl").textContent = "1";
    document.getElementById("linesEl").textContent = "0";
    document.getElementById("restartBtn").style.display = "none";
    document.getElementById("ttError").textContent = "";
    scheduleDrop();
  }

  function scheduleDrop() {
    clearInterval(dropTimer);
    const speed = Math.max(120, 700 - (level - 1) * 60);
    dropTimer = setInterval(() => softDrop(false), speed);
  }

  function lockPiece() {
    for (const [x, y] of cells(cur)) {
      if (y < 0) { endGame(); return; }
      grid[y][x] = COLORS[cur.type];
    }
    clearLines();
    cur = newPiece(next);
    next = randType();
    if (!canPlace(cur)) { endGame(); return; }
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(c => c)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++; // re-check this row index after the shift
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      level = 1 + Math.floor(lines / 10);
      document.getElementById("scoreEl").textContent = score;
      document.getElementById("linesEl").textContent = lines;
      document.getElementById("levelEl").textContent = level;
      scheduleDrop();
    }
  }

  function move(dx) {
    if (gameOver || paused) return;
    const p = { ...cur, x: cur.x + dx };
    if (canPlace(p)) cur = p;
  }

  function rotatePiece() {
    if (gameOver || paused) return;
    const p = { ...cur, rotation: (cur.rotation + 1) % 4 };
    if (canPlace(p)) { cur = p; return; }
    // Simple wall-kick attempt: nudge left/right by 1 if the rotated shape doesn't fit in place.
    for (const dx of [-1, 1, -2, 2]) {
      const kicked = { ...p, x: p.x + dx };
      if (canPlace(kicked)) { cur = kicked; return; }
    }
  }

  function softDrop(manual) {
    if (gameOver || paused) return;
    const p = { ...cur, y: cur.y + 1 };
    if (canPlace(p)) {
      cur = p;
      if (manual) score++;
    } else {
      lockPiece();
    }
  }

  function hardDrop() {
    if (gameOver || paused) return;
    let p = { ...cur };
    while (canPlace({ ...p, y: p.y + 1 })) { p = { ...p, y: p.y + 1 }; score += 2; }
    cur = p;
    lockPiece();
  }

  function endGame() {
    gameOver = true;
    clearInterval(dropTimer);
    document.getElementById("restartBtn").style.display = "inline-block";
    claimTetrisCoins();
  }

  function drawCell(c, x, y, color) {
    c.fillStyle = color;
    c.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[y][x]) drawCell(ctx, x, y, grid[y][x]);
      }
    }
    if (!gameOver) {
      for (const [x, y] of cells(cur)) {
        if (y >= 0) drawCell(ctx, x, y, COLORS[cur.type]);
      }
    }
    if (gameOver) {
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 22px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = "15px sans-serif";
      ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 16);
    }

    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    const shape = SHAPES[next][0];
    shape.forEach(([dx, dy]) => drawCell(nctx, dx - 0.5, dy - 0.5, COLORS[next]));
  }

  function loop() {
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener("keydown", (e) => {
    if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", "Space"].includes(e.code)) e.preventDefault();
    if (e.code === "ArrowLeft") move(-1);
    else if (e.code === "ArrowRight") move(1);
    else if (e.code === "ArrowDown") softDrop(true);
    else if (e.code === "ArrowUp") rotatePiece();
    else if (e.code === "Space") hardDrop();
  });
  document.getElementById("btnLeft").addEventListener("click", () => move(-1));
  document.getElementById("btnRight").addEventListener("click", () => move(1));
  document.getElementById("btnDown").addEventListener("click", () => softDrop(true));
  document.getElementById("btnRotate").addEventListener("click", () => rotatePiece());
  document.getElementById("btnDrop").addEventListener("click", () => hardDrop());
  document.getElementById("restartBtn").addEventListener("click", reset);

  reset();
  loop();
</script>

</body>
</html>
