<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neighborhood — Kelleher Innovations</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ══════════════════════════════════════
     Neighborhood — prefix .hn-. Every member's customizable house on a
     shared map. Public to browse, login required to customize/buy/place.
  ══════════════════════════════════════ */
  .hn-hero { text-align: center; margin-bottom: 26px; }
  .hn-hero h1 { font-size: 1.8rem; margin-bottom: 8px; }
  .hn-hero p { color: var(--muted); max-width: 560px; margin: 0 auto; }

  .hn-topbar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 12px; margin-bottom: 22px;
  }
  .hn-tabs { display: flex; gap: 4px; background: var(--bg2); border-radius: 8px; padding: 4px; }
  .hn-tab {
    padding: 9px 18px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 700;
    color: var(--muted); transition: background 0.2s, color 0.2s;
  }
  .hn-tab.active { background: var(--accent); color: #000; }
  .hn-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    font-size: 0.9rem; font-weight: 800; color: #ffd166;
  }
  .hn-hint { color: var(--muted); font-size: 0.82rem; text-align: center; margin: 0 auto 18px; max-width: 520px; }

  /* ── House rendering (shared between map cards + the big detail/editor view) ── */
  .hn-building { position: relative; margin: 0 auto; }
  .hn-roof {
    width: 0; height: 0; margin: 0 auto;
    border-left: solid transparent; border-right: solid transparent; border-bottom: solid;
  }
  .hn-wall { position: relative; margin: 0 auto; border-radius: 0 0 4px 4px; }
  .hn-door { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); background: #2b2118; border-radius: 3px 3px 0 0; }
  .hn-window { position: absolute; background: #cfe9ff; border: 1px solid rgba(0,0,0,0.35); border-radius: 2px; }

  /* ── Map grid ── */
  .hn-map-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px;
  }
  .hn-house-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 12px; text-align: center; cursor: pointer; transition: border-color 0.2s, transform 0.15s;
  }
  .hn-house-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .hn-house-card .hn-owner { margin-top: 10px; font-weight: 700; font-size: 0.85rem; }
  .hn-house-card .hn-owner-sub { color: var(--muted); font-size: 0.72rem; }
  .hn-item-badge {
    display: inline-flex; align-items: center; gap: 4px; margin-top: 4px;
    font-size: 0.72rem; color: var(--muted);
  }

  /* ── Detail / editor modal ── */
  .hn-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none;
    align-items: flex-start; justify-content: center; z-index: 600; padding: 24px 16px; overflow-y: auto;
  }
  .hn-modal-overlay.open { display: flex; }
  .hn-modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    max-width: 680px; width: 100%; padding: 22px; position: relative;
  }
  .hn-modal-close {
    position: absolute; top: 14px; right: 14px; background: none; border: none;
    color: var(--muted); font-size: 1.4rem; cursor: pointer; line-height: 1;
  }
  .hn-modal-close:hover { color: var(--text); }

  .hn-yard {
    display: grid; margin: 16px auto 0; border-radius: 8px; overflow: hidden;
    border: 2px solid rgba(0,0,0,0.35);
  }
  .hn-yard-cell {
    display: flex; align-items: center; justify-content: center; position: relative;
    border: 1px solid rgba(255,255,255,0.06); font-size: 1.5rem;
  }
  .hn-yard-cell.editable { cursor: pointer; }
  .hn-yard-cell.editable:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hn-yard-cell.armed-target { outline: 2px dashed var(--accent); outline-offset: -2px; }

  .hn-section-label {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent);
    margin: 18px 0 8px;
  }
  .hn-swatch-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hn-swatch {
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer; border: 2px solid transparent;
  }
  .hn-swatch.selected { border-color: var(--accent); transform: scale(1.1); }

  .hn-shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .hn-shop-item {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center;
  }
  .hn-shop-item .emoji { font-size: 1.8rem; }
  .hn-shop-item .name { font-size: 0.72rem; font-weight: 700; }
  .hn-shop-item .price { font-size: 0.72rem; color: #ffd166; font-weight: 700; }
  .hn-buy-btn {
    margin-top: 4px; padding: 6px 10px; background: var(--accent); color: #000; border: none;
    border-radius: 6px; font-weight: 700; font-size: 0.72rem; cursor: pointer; font-family: inherit;
  }
  .hn-buy-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .hn-inventory-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hn-inv-item {
    width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; background: var(--bg2); border: 2px solid var(--border); border-radius: 8px;
    cursor: pointer;
  }
  .hn-inv-item.armed { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,200,200,0.4); }
  .hn-empty-note { color: var(--muted); font-size: 0.78rem; }
  .hn-error { color: #ff6b6b; font-size: 0.82rem; min-height: 1.2em; margin-top: 8px; }

  .hn-login-hint {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; text-align: center; max-width: 420px; margin: 0 auto;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="site-brand">
      <strong>Kelleher Innovations</strong>
      <span>Building Intelligent Systems</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="games.html">Games</a>
    </nav>
  </div>
</header>

<main>
  <div class="hn-hero">
    <h1>🏘️ Neighborhood</h1>
    <p>Every member gets a house. Customize the colors, buy things to pimp it out, and see what everyone else has built.</p>
  </div>

  <div class="hn-topbar">
    <div class="hn-tabs">
      <div class="hn-tab active" data-tab="map">🗺️ Map</div>
      <div class="hn-tab" data-tab="mine">🏠 My House</div>
    </div>
    <span class="hn-chip" id="coinChip" style="display:none;">🪙 <span id="coinBalance">0</span> KellsCoins</span>
  </div>

  <div id="mapView">
    <div class="hn-map-grid" id="mapGrid"></div>
  </div>

  <div id="mineView" style="display:none;">
    <div id="loginHint" class="hn-login-hint" style="display:none;">
      <p>Log in on the <a href="games.html">Games hub</a> to customize your own house.</p>
    </div>
    <div id="editorWrap" style="display:none;"></div>
  </div>

  <div class="hn-modal-overlay" id="detailModal">
    <div class="hn-modal">
      <button class="hn-modal-close" id="closeDetail">&times;</button>
      <div id="detailContent"></div>
    </div>
  </div>
</main>

<script>
  const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://localhost:4567/housing" : "https://api.kellinnovations.com/housing";
  const GAMES_API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://localhost:4567/games" : "https://api.kellinnovations.com/games";

  async function api(path, opts) {
    opts = opts || {};
    const res = await fetch(API + path, {
      method: opts.method || "GET", credentials: "include",
      headers: opts.body ? { "Content-Type": "application/json" } : undefined,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Something went wrong");
    return data;
  }

  let currentUser = null;
  let catalogData = null; // { items, wall_colors, roof_colors, yard_colors, grid_cols, grid_rows }
  let myHouseData = null; // { house, placed, inventory }
  let armedItemId = null;

  // ── Rendering helpers ────────────────────────────────────────────────
  function buildingHTML(house, { small } = {}) {
    const wallW = small ? 70 : 160, wallH = small ? 46 : 100;
    const roofW = small ? 84 : 190, roofH = small ? 34 : 70;
    return `
      <div class="hn-building">
        <div class="hn-roof" style="border-left-width:${roofW / 2}px; border-right-width:${roofW / 2}px; border-bottom-width:${roofH}px; border-bottom-color:${house.roof_color};"></div>
        <div class="hn-wall" style="width:${wallW}px; height:${wallH}px; background:${house.wall_color};">
          <div class="hn-window" style="width:${wallH * 0.22}px; height:${wallH * 0.22}px; top:${wallH * 0.18}px; left:${wallW * 0.18}px;"></div>
          <div class="hn-window" style="width:${wallH * 0.22}px; height:${wallH * 0.22}px; top:${wallH * 0.18}px; right:${wallW * 0.18}px;"></div>
          <div class="hn-door" style="width:${wallW * 0.2}px; height:${wallH * 0.55}px;"></div>
        </div>
      </div>`;
  }

  function itemEmoji(key) {
    const item = catalogData.items.find(i => i.key === key);
    return item ? item.emoji : "❓";
  }

  function renderMapCard(entry) {
    const card = document.createElement("div");
    card.className = "hn-house-card";
    card.innerHTML = `
      ${buildingHTML(entry.house, { small: true })}
      <div class="hn-owner">${entry.avatar_emoji || "🙂"} ${escHtml(entry.name || "Member")}</div>
      <div class="hn-item-badge">🪴 ${entry.placed.length} item${entry.placed.length === 1 ? "" : "s"}</div>
    `;
    card.addEventListener("click", () => openDetail(entry.user_id));
    return card;
  }

  async function loadMap() {
    const data = await api("/all");
    const grid = document.getElementById("mapGrid");
    grid.innerHTML = "";
    data.houses.forEach(entry => grid.appendChild(renderMapCard(entry)));
  }

  function yardGridHTML(house, placed, gridCols, gridRows, { editable } = {}) {
    const cellMap = {};
    placed.forEach(i => { cellMap[`${i.x},${i.y}`] = i; });
    let html = `<div class="hn-yard" style="grid-template-columns: repeat(${gridCols}, 1fr); background:${house.yard_color}; width:min(100%, 480px); aspect-ratio:${gridCols}/${gridRows};">`;
    for (let y = 0; y < gridRows; y++) {
      for (let x = 0; x < gridCols; x++) {
        const occupant = cellMap[`${x},${y}`];
        const cls = editable ? "hn-yard-cell editable" : "hn-yard-cell";
        html += `<div class="${cls}" data-x="${x}" data-y="${y}" data-item-id="${occupant ? occupant.id : ""}">${occupant ? occupant.emoji : ""}</div>`;
      }
    }
    html += `</div>`;
    return html;
  }

  async function openDetail(userId) {
    const data = await api(`/house/${encodeURIComponent(userId)}`);
    const content = document.getElementById("detailContent");
    content.innerHTML = `
      <h3 style="text-align:center;">${data.avatar_emoji || "🙂"} ${escHtml(data.name || "Member")}'s House</h3>
      <div style="display:flex; justify-content:center;">${buildingHTML(data.house)}</div>
      <div style="display:flex; justify-content:center;">
        ${yardGridHTML(data.house, data.placed, catalogData.grid_cols, catalogData.grid_rows)}
      </div>
    `;
    document.getElementById("detailModal").classList.add("open");
  }
  document.getElementById("closeDetail").addEventListener("click", () => {
    document.getElementById("detailModal").classList.remove("open");
  });
  document.getElementById("detailModal").addEventListener("click", (e) => {
    if (e.target.id === "detailModal") e.target.classList.remove("open");
  });

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ── My House editor ─────────────────────────────────────────────────
  async function loadMine() {
    myHouseData = await api("/mine");
    renderEditor();
  }

  function renderEditor() {
    const wrap = document.getElementById("editorWrap");
    const { house, placed, inventory } = myHouseData;

    const swatchRow = (colors, current, kind) => colors.map(c =>
      `<div class="hn-swatch ${c === current ? "selected" : ""}" style="background:${c};" data-kind="${kind}" data-color="${c}"></div>`
    ).join("");

    wrap.innerHTML = `
      <div style="display:flex; justify-content:center;">${buildingHTML(house)}</div>
      <div style="display:flex; justify-content:center;">
        ${yardGridHTML(house, placed, catalogData.grid_cols, catalogData.grid_rows, { editable: true })}
      </div>
      <div class="hn-error" id="hnError"></div>

      <div class="hn-section-label">Wall Color</div>
      <div class="hn-swatch-row" id="wallSwatches">${swatchRow(catalogData.wall_colors, house.wall_color, "wall")}</div>
      <div class="hn-section-label">Roof Color</div>
      <div class="hn-swatch-row" id="roofSwatches">${swatchRow(catalogData.roof_colors, house.roof_color, "roof")}</div>
      <div class="hn-section-label">Yard Color</div>
      <div class="hn-swatch-row" id="yardSwatches">${swatchRow(catalogData.yard_colors, house.yard_color, "yard")}</div>

      <div class="hn-section-label">Inventory ${armedItemId ? "— click a yard cell to place" : "(click an item, then click the yard)"}</div>
      <div class="hn-inventory-row" id="inventoryRow">
        ${inventory.length ? inventory.map(i =>
          `<div class="hn-inv-item ${i.id === armedItemId ? "armed" : ""}" data-item-id="${i.id}" title="${escHtml(i.name)}">${i.emoji}</div>`
        ).join("") : '<span class="hn-empty-note">Nothing in inventory — buy something below.</span>'}
      </div>

      <div class="hn-section-label">Shop</div>
      <div class="hn-shop-grid" id="shopGrid">
        ${catalogData.items.map(i => `
          <div class="hn-shop-item">
            <div class="emoji">${i.emoji}</div>
            <div class="name">${escHtml(i.name)}</div>
            <div class="price">🪙 ${i.price.toLocaleString()}</div>
            <button class="hn-buy-btn" data-key="${i.key}" ${currentUser && currentUser.kellscoins < i.price ? "disabled" : ""}>Buy</button>
          </div>
        `).join("")}
      </div>
    `;

    wrap.querySelectorAll(".hn-swatch").forEach(sw => {
      sw.addEventListener("click", async () => {
        const kind = sw.dataset.kind, color = sw.dataset.color;
        try {
          const body = {};
          body[`${kind}_color`] = color;
          const updated = await api("/customize", { method: "POST", body });
          myHouseData.house = updated;
          renderEditor();
        } catch (e) { showError(e.message); }
      });
    });

    wrap.querySelectorAll(".hn-inv-item").forEach(el => {
      el.addEventListener("click", () => {
        const id = parseInt(el.dataset.itemId, 10);
        armedItemId = armedItemId === id ? null : id;
        renderEditor();
      });
    });

    wrap.querySelectorAll(".hn-yard-cell").forEach(cell => {
      cell.addEventListener("click", async () => {
        const x = parseInt(cell.dataset.x, 10), y = parseInt(cell.dataset.y, 10);
        const occupantId = cell.dataset.itemId ? parseInt(cell.dataset.itemId, 10) : null;
        try {
          if (occupantId && !armedItemId) {
            // Clicking an already-placed item with nothing armed picks it back up.
            const updated = await api("/unplace", { method: "POST", body: { item_id: occupantId } });
            myHouseData.inventory.push(updated);
            myHouseData.placed = myHouseData.placed.filter(i => i.id !== occupantId);
            renderEditor();
          } else if (armedItemId && !occupantId) {
            const updated = await api("/place", { method: "POST", body: { item_id: armedItemId, x, y } });
            myHouseData.inventory = myHouseData.inventory.filter(i => i.id !== armedItemId);
            myHouseData.placed.push(updated);
            armedItemId = null;
            renderEditor();
          }
        } catch (e) { showError(e.message); }
      });
    });

    wrap.querySelectorAll(".hn-buy-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        try {
          const res = await api("/buy", { method: "POST", body: { item_key: btn.dataset.key } });
          currentUser.kellscoins = res.balance;
          updateCoinChip();
          myHouseData.inventory.push(res.item);
          renderEditor();
        } catch (e) { showError(e.message); }
      });
    });
  }

  function showError(msg) {
    const el = document.getElementById("hnError");
    if (el) el.textContent = msg;
  }

  function updateCoinChip() {
    if (currentUser) {
      document.getElementById("coinChip").style.display = "inline-flex";
      document.getElementById("coinBalance").textContent = currentUser.kellscoins.toLocaleString();
    }
  }

  // ── Tabs ─────────────────────────────────────────────────────────────
  document.querySelectorAll(".hn-tab").forEach(tab => {
    tab.addEventListener("click", async () => {
      document.querySelectorAll(".hn-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      const which = tab.dataset.tab;
      document.getElementById("mapView").style.display = which === "map" ? "block" : "none";
      document.getElementById("mineView").style.display = which === "mine" ? "block" : "none";
      if (which === "mine" && currentUser && !myHouseData) {
        await loadMine();
      }
    });
  });

  async function boot() {
    catalogData = await api("/catalog");
    try {
      currentUser = await (await fetch(GAMES_API + "/auth/me", { credentials: "include" })).json();
      if (!currentUser || !currentUser.id) currentUser = null;
    } catch (e) { currentUser = null; }

    updateCoinChip();
    if (!currentUser) {
      document.getElementById("loginHint").style.display = "block";
    } else {
      document.getElementById("editorWrap").style.display = "block";
    }
    await loadMap();
  }
  boot();
</script>

</body>
</html>
